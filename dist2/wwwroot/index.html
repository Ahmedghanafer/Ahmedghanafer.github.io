<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <base href="/" />

    <title>Ahmed Ghanafer — Fullstack .NET Developer</title>
    <meta name="description" content="Fullstack .NET developer in Stockholm. Seven years across CRM platforms, automation tooling and product engineering — and one live analytics platform I built and operate end to end." />
    <meta name="author" content="Ahmed Ghanafer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f4f0" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ahmed Ghanafer — Fullstack .NET Developer" />
    <meta property="og:description" content="Fullstack .NET developer in Stockholm. Built in Blazor WebAssembly — the whole page is C#." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />

    <link rel="stylesheet" href="css/app.css" />

    <!--
        Theme is applied before first paint so there is no flash of the wrong
        surface. This is the one script that cannot wait for the .NET runtime.
    -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem("ahg-theme");
                var dark = stored ? stored === "dark"
                    : window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
                if (dark) {
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute("content", "#100e0c");
                }
            } catch (e) { /* defaults are fine */ }
        })();
    </script>
</head>

<body>
    <!-- Shown while the .NET runtime downloads; hidden by interop.markReady(). -->
    <div id="blazor-boot" aria-hidden="true">
        <div class="boot-mark">Loading .NET runtime</div>
        <div class="boot-bar"><span></span></div>
    </div>

    <div id="app">
        <noscript>
            <div style="padding:3rem 1.5rem;max-width:44rem;margin:0 auto;font-family:system-ui,sans-serif">
                <h1>Ahmed Ghanafer</h1>
                <p>Fullstack .NET developer, Stockholm. This site is a Blazor WebAssembly app, so it needs
                   JavaScript enabled to start the .NET runtime.</p>
                <p>You can reach me at
                   <a href="mailto:ahmed.ghanafer@gmail.com">ahmed.ghanafer@gmail.com</a>,
                   on <a href="https://github.com/Ahmedghanafer">GitHub</a>, or on
                   <a href="https://linkedin.com/in/ahmed-ghanafer-374804123">LinkedIn</a>.</p>
            </div>
        </noscript>
    </div>

    <div id="blazor-error-ui">
        Something went wrong. A reload usually fixes it.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">×</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
